name: Publish graph-ics to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.15
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Verify release version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          assert os.environ["GITHUB_REF_NAME"] == f"v{version}", "Release tag does not match package version"
          PY

      - name: Install Cairo build dependencies
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config python3-dev

      - name: Install development and rendering dependencies
        env:
          PYYAML_FORCE_LIBYAML: "0"
        run: python -m pip install -e ".[dev,render]"

      - name: Run tests
        run: python -m pytest --cov=graph_ics

      - name: Check typing
        run: python -m scripts.typecheck

      - name: Lint
        run: python -m ruff check .

      - name: Build and validate distributions
        run: python -m scripts.release --check

      - name: Verify clean installation
        run: python -m scripts.check_wheel

      - name: Store distributions
        uses: actions/upload-artifact@v6
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/graph-graphics

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: release-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1