[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-ics"
version = "0.0.1"
description = "Generative artwork from sprawling spatial graphs"
keywords = ["generative-art", "graph", "svg", "procedural", "visualization"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only", "Topic :: Multimedia :: Graphics"]
readme = "README-PYPI.md"
requires-python = ">=3.11,<3.16"
license = "PolyForm-Noncommercial-1.0.0 AND CC-BY-NC-4.0"
license-files = ["LICENSE", "LICENSE-ARTWORK", "LICENSING.md"]
dependencies = ["shapely>=2.0,<3", "networkx>=3.2,<4", "PyYAML>=6,<7"]

[project.urls]
Homepage = "https://graph-ics.pippidis.no"
Documentation = "https://graph-ics.pippidis.no/guide/"
Author = "https://pippidis.no"
Repository = "https://github.com/pippidis/graph_ics"
Issues = "https://github.com/pippidis/graph_ics/issues"

[project.scripts]
graph-ics = "graph_ics.cli:main"

[project.optional-dependencies]
render = ["pycairo>=1.26,<2", "Pillow>=12.1,<14"]
data = ["Pillow>=12.1,<14"]

dev = ["Markdown>=3.7,<4", "pytest>=8,<10", "pytest-cov>=5,<8", "mypy>=1.10,<3", "ruff>=0.9,<1", "build>=1.2,<2", "twine>=6,<7", "setuptools>=77", "wheel", "types-shapely>=2,<3", "types-networkx>=3,<4", "types-PyYAML>=6,<7", "Pillow>=12.1,<14"]

[tool.setuptools]
packages = ["graph_ics", "graph_ics.data"]
package-dir = {graph_ics = "src"}

[tool.setuptools.package-data]
graph_ics = ["py.typed", "data/*.gz", "data/*.json", "data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["graph_ics"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 200
target-version = "py311"
include = ["src/*.py", "scripts/*.py", "tests/test_setup.py", "tests/test_geometry.py", "tests/test_growth.py", "tests/test_spatial.py", "tests/test_fields.py", "tests/test_contours.py", "tests/test_coverage.py", "tests/test_quality.py", "tests/test_colonies.py", "tests/test_composition.py", "tests/test_replay.py", "tests/test_samples.py", "tests/test_scene.py", "examples/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E701"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/site_paths.py", "scripts/release.py", "examples/_support.py", "scripts/generate_examples.py", "scripts/generate_logos.py", "src/logo.py", "tests/test_scene.py", "src/scene.py", "src/scene_gallery.py", "src/color_fields.py", "src/__init__.py", "src/colors.py", "src/drawing.py", "src/vector.py", "src/node.py", "src/edge.py", "src/graph.py", "src/rendering.py", "src/growth.py", "src/spatial.py", "src/fields.py", "src/contours.py", "src/coverage.py", "src/quality.py", "src/colonies.py", "src/text.py", "src/styles.py", "src/replay.py", "src/animation.py", "src/obj.py", "src/samples.py", "src/gallery.py", "src/gallery_page.py", "src/validation.py", "src/cli.py", "src/uk.py", "src/data/__init__.py", "scripts/prepare_uk_data.py", "src/option_gallery.py", "src/__main__.py",
         "scripts/check_wheel.py", "scripts/generate_readme_preview.py", "tests/geometry_assertions.py", "scripts/typecheck.py", "examples/basic_graph/example.py", "tests/test_geometry.py", "tests/test_growth.py", "tests/test_spatial.py", "scripts/benchmark_spatial.py", "tests/test_fields.py", "tests/test_contours.py", "tests/test_coverage.py", "tests/test_quality.py", "tests/test_colonies.py", "tests/test_composition.py", "tests/test_replay.py", "tests/test_samples.py", "examples/name_composition/example.py", "scripts/generate_animation.py", "examples/sample_library/example.py"]
follow_imports = "normal"
